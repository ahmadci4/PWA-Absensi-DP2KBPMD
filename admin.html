<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - AbsensiKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#0ea5e9', secondary: '#14b8a6' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-primary">Admin Panel Absensi</h1>
        <span class="text-sm bg-sky-100 text-sky-700 px-3 py-1 rounded-full">Realtime Monitoring</span>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100">
                <h2 class="text-lg font-bold">Data Absensi Hari Ini</h2>
                <p class="text-sm text-gray-500">Data ini akan otomatis terhapus dalam 24 jam.</p>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                            <th class="p-4 font-semibold">Waktu</th>
                            <th class="p-4 font-semibold">Nama & Jabatan</th>
                            <th class="p-4 font-semibold">Tipe</th>
                            <th class="p-4 font-semibold">Jarak ke Kantor</th>
                            <th class="p-4 font-semibold">Bukti Foto</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- Data akan dimuat di sini oleh JS -->
                        <tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Firebase SDK & Logika Fetch Data -->
    <script type="module">
        import { db } from './js/firebase-app.js';
        import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const tableBody = document.getElementById('tableBody');
        
        // Menggunakan onSnapshot untuk realtime data update
        const q = query(collection(db, "absensi"), orderBy("waktu", "desc"));
        
        onSnapshot(q, (snapshot) => {
            tableBody.innerHTML = '';
            if(snapshot.empty) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada data hari ini.</td></tr>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                // Format waktu yang aman
                const waktu = data.waktu ? new Date(data.waktu.toDate()).toLocaleTimeString('id-ID') : 'Menunggu...';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-sky-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-4">${waktu} WITA</td>
                    <td class="p-4 font-medium text-gray-900">${data.nama} <br><span class="text-xs text-gray-500 font-normal">${data.jabatan}</span></td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${data.tipe === 'masuk' ? 'bg-blue-100 text-blue-700' : 'bg-rose-100 text-rose-700'}">
                            ${data.tipe.toUpperCase()}
                        </span>
                    </td>
                    <td class="p-4">${data.lokasi ? data.lokasi.jarak + ' meter' : '-'}</td>
                    <td class="p-4">
                        <a href="${data.fotoUrl}" target="_blank" class="text-primary hover:underline text-xs flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Lihat Foto
                        </a>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
