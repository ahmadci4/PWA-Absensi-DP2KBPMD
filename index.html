<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Lapangan PWA</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Sky blue
                        secondary: '#14b8a6', // Tosca
                        accent: '#fef08a', // Soft Yellow
                    }
                }
            }
        }
    </script>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module" src="./js/firebase-app.js" defer></script>
    <script type="module" src="./js/auth.js" defer></script>
    <script type="module" src="./js/app.js" defer></script>

    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans antialiased min-h-screen">

    <!-- SCREEN 1: LOGIN (Device Binding) -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 fade-in">
        <div class="glass-card w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="bg-primary/10 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Registrasi Perangkat</h1>
                <p class="text-sm text-gray-500 mt-2">Satu perangkat hanya untuk satu pengguna</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="userName" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Contoh: Ahmad Yani">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jabatan / Role</label>
                    <select id="userRole" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all bg-white">
                        <option value="" disabled selected>Pilih Jabatan</option>
                        <option value="SPMD">SPMD</option>
                        <option value="PLKB">PLKB</option>
                        <option value="PKB">PKB</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-sky-600 text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-95">
                    Daftar & Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- SCREEN 2: DASHBOARD USER -->
    <div id="dashboardScreen" class="hidden min-h-screen flex-col pb-20 fade-in">
        <!-- Header -->
        <header class="bg-primary text-white p-6 rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-sky-100 text-sm">Selamat datang,</p>
                    <h2 id="greetName" class="text-xl font-bold">Nama User</h2>
                    <p id="greetRole" class="text-xs bg-white/20 inline-block px-2 py-1 rounded-md mt-1">Jabatan</p>
                </div>
                <div class="bg-white/20 p-2 rounded-xl">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-4 -mt-4">
            <!-- Status Card -->
            <div class="glass-card p-5 mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-gray-800">Status Hari Ini</h3>
                        <p id="absenStatus" class="text-sm text-gray-500">Belum Absen Masuk</p>
                    </div>
                    <div id="statusBadge" class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold">
                        Pending
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button id="btnAbsenMasuk" class="bg-secondary hover:bg-teal-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center transition-all active:scale-95">
                    <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    <span class="font-semibold">Absen Masuk</span>
                </button>
                <button id="btnAbsenPulang" class="bg-rose-500 hover:bg-rose-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center transition-all active:scale-95 opacity-50 pointer-events-none">
                    <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span class="font-semibold">Absen Pulang</span>
                </button>
            </div>

            <!-- Upload Kegiatan Button -->
            <button id="btnUploadKegiatan" class="w-full glass-card border-2 border-dashed border-primary text-primary p-4 rounded-2xl flex items-center justify-center space-x-2 hover:bg-sky-50 transition-all active:scale-95">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span class="font-bold">Upload Kegiatan (Timeline)</span>
            </button>
        </main>
    </div>

    <!-- Pendaftaran Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Reg failed:', err));
            });
        }
    </script>
</body>
</html>
